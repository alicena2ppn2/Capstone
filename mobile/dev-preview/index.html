<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY MOCHI · 모바일 화면 크기 미리보기</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body { height: 100dvh; display: grid; grid-template-rows: auto minmax(0,1fr) auto; gap: 10px; padding: 16px; background: #E4F1EE; color: #354744; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { text-align: center; }
h1 { margin: 0; font-size: 18px; font-weight: 600; }
p { margin: 4px 0 0; color: #65736F; }
.controls { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
a, button { font: inherit; color: #354744; }
button { min-height: 44px; padding: 6px 14px; background: #FFFEFA; border: 1px solid #65736F; border-radius: 12px; cursor: pointer; }
a:focus-visible, button:focus-visible, iframe:focus-visible { outline: 3px solid #397D78; outline-offset: 3px; }
#stage { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
#frame-slot { position: relative; flex: none; }
iframe { display: block; position: absolute; inset: 0 auto auto 0; width: 390px; height: 844px; border: 0; background: #FFF9F0; transform-origin: top left; border-radius: 16px; box-shadow: 0 4px 18px #35474426; }
footer { text-align: center; font-size: 12px; color: #65736F; }
</style>
</head>
<body>
<header>
<h1>MY MOCHI · 모바일 화면 크기 미리보기</h1>
<p>Expo 웹을 390 × 844 CSS px로 표시합니다. 실제 기기 에뮬레이터가 아닙니다.</p>
<div class="controls"><span id="scale-label" role="status">표시 배율 계산 중</span><button id="reload" type="button">앱 새로고침</button><a href="http://localhost:5183/" target="_blank" rel="noopener">앱 직접 열기</a></div>
</header>
<main id="stage" aria-label="모바일 크기 미리보기"><div id="frame-slot"><iframe id="app-frame" title="MY MOCHI Expo 웹 · 390 × 844 화면" src="http://localhost:5183/"></iframe></div></main>
<footer>개발 전용 · 버튼, 탭, 스크롤은 실제 앱에서 동작합니다. 앱 서버 localhost:5183이 실행 중이어야 합니다.</footer>
<script>
const stage = document.getElementById('stage'), slot = document.getElementById('frame-slot'), frame = document.getElementById('app-frame');
function fit() {
  const scale = Math.max(0.001, Math.min(1, (stage.clientWidth - 20) / 390, (stage.clientHeight - 20) / 844));
  slot.style.width = `${390 * scale}px`; slot.style.height = `${844 * scale}px`;
  frame.style.transform = `scale(${scale})`;
  document.getElementById('scale-label').textContent = `390 × 844 · 표시 ${Math.round(scale * 100)}%`;
}
new ResizeObserver(fit).observe(stage); fit();
document.getElementById('reload').addEventListener('click', () => { frame.src = 'http://localhost:5183/'; });
</script>
</body></html>
